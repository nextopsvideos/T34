apiVersion: v1
kind: Service
metadata:
  name: mysql-hl-svc
  labels:
    app: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
    protocol: TCP

# FQDN Fully Qualified Domain Name
# headlessservicename.namespacename.svc.cluster.local
# mysql-hl-svc.default.svc.cluster.local
# statefutsetname.headlessservicename.namespacename.svc.cluster.local
# mysql-sts.mysql-hl-svc.default.svc.cluster.local
# podname.statefutsetname.headlessservicename.namespacename.svc.cluster.local
# mysql-sts-0.mysql-sts.mysql-hl-svc.default.svc.cluster.local
# mysql-sts-1.mysql-sts.mysql-hl-svc.default.svc.cluster.local
# mysql-sts-2.mysql-sts.mysql-hl-svc.default.svc.cluster.local