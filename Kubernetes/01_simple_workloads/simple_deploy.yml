apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
    env: prod
spec: 
  replicas: 1                   # it creates a replicaset in the background
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx-pod
      labels:
        app: nginx 
    spec:
      containers:
      - name: nginx 
        image: nginx
        ports:
        - containerPort: 80  