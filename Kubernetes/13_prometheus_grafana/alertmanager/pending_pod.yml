#for simulating alterrule use this yaml
apiVersion: v1
kind: Pod
metadata:
  name: pending-pod-example
spec:
  containers:
    - name: resource-hungry-container
      image: nginx
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "1000Mi" # previous value 512Mi, new value 1000Mi, generated by AI
          cpu: "1000m"  # previous value 500m, new value 1000m, generated by AI