apiVersion: v1 
kind: ResourceQuota
metadata:
  name: dev-team-res-quota
  namespace: dev-team
spec:
  hard:
    pods: "10"
    requests.cpu: "1"               #minimum cpu      1 CPU = 1000m CPU /10 = 100m CPU per pod
    requests.memory: "1Gi"          #minimum memory   1 Gi  = 1000Mi RAM / 10 = 100Mi RAM per pod
    limits.cpu: "2"                 #maximum cpu      2 CPU = 2000m CPU / 10 = 200m CPU per pod
    limits.memory: "2Gi"            #maximum memory   2 Gi  = 2000Mi RAM / 10 = 200Mi RAM per pod