apiVersion: apps/v1 
kind: Deployment
metadata:
  name: nginx-deploy-rq
  labels:
    app: nginx
  namespace: dev-team
spec:
  replicas: 10      
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx  
          image: nginx 
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"                  #minimum cpu      100m CPU per pod
              memory: "100Mi"              #minimum memory   100Mi RAM per pod
            limits:
              cpu: "200m"
              memory: "200Mi"              #OOMKilled