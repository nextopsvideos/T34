apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-cross-namespace-traffic
  namespace: dev-team
spec:
  podSelector: 
    matchLabels:
      app: nginx
  policyTypes:
  - Ingress                   #block incoming traffic
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: default