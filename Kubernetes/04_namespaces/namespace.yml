---
apiVersion: v1
kind: Namespace
metadata:
  name: prod-resources
---
apiVersion: v1
kind: Pod
metadata:
  name: single-container-pod
  namespace: prod-resources       #this forces the pod to be created in the prod-resources namespace
spec:
  containers:
  - name: my-container
    image: nginx
    ports:
    - containerPort: 80