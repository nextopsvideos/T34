apiVersion: apps/v1
kind: Deployment      #Controller for the pods
metadata:
  name: httpd-deploy 
  labels:
    app: httpd
spec:
  replicas: 10
  selector:
    matchLabels:
      app: httpd
  template:
    metadata:
      labels:
        app: httpd 
    spec:
      containers:
      - name: httpd
        image: httpd
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: httpd-service
  labels:
    app: httpd
spec:
  type: LoadBalancer        #Layer4 LoadBalancer
  selector:
    app: httpd
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80