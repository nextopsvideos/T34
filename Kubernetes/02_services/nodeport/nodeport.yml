apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-np
  labels:
    app: nginxnp 
spec:
  replicas: 5
  selector:
    matchLabels:
      app: nginxnp
  template:
    metadata:
      name: nginx-pod-np
      labels:
        app: nginxnp
    spec:
      containers:
      - name: nginx 
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-np-service
  labels:
    app: nginxnp
spec:
  type: NodePort
  selector:
    app: nginxnp
  ports:
  - protocol: TCP
    port: 80                      #32476  this will be above 31000
    targetPort: 80